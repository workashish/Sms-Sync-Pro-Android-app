name: Publish signed APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, for example v2.2
        required: true
        type: string
      version_code:
        description: Increasing Android versionCode
        required: true
        type: number
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare signing material
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/key.p12"
          printf '%s' "$RELEASE_PASSWORD" > "$RUNNER_TEMP/key-password.txt"
          chmod 600 "$RUNNER_TEMP/key.p12" "$RUNNER_TEMP/key-password.txt"
      - name: Build signed release
        env:
          TAG: ${{ inputs.tag }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+(?:\.[0-9]+)*", os.environ["TAG"]); assert int(os.environ["VERSION_CODE"]) > 0'
          python3 scripts/build_release.py --keystore "$RUNNER_TEMP/key.p12" --password-file "$RUNNER_TEMP/key-password.txt" --version-code "$VERSION_CODE" --version-name "${TAG#v}"
      - name: Publish release and APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" app/build/outputs/apk/release/app-release.apk --title "SMS Sync Pro $TAG" --notes-file RELEASE_NOTES.md
